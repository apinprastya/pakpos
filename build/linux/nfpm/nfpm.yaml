# nfpm config for the Pakpos .deb / .rpm / Arch packages, built by
# `wails3 task package:linux` (linux:generate:deb|rpm|aur → `wails3 tool package`).
# See https://nfpm.goreleaser.com.
#
# Identity mirrors build/config.yml. NOTE: `wails3 task common:update:build-assets`
# rewrites this file from the Wails template; re-apply this version afterwards.
#
# PAKPOS_PKG_VERSION and GOARCH are set by the Linux Taskfile (VERSION from the
# root Taskfile: git describe / PAKPOS_VERSION, CalVer e.g. 26.11.1). nfpm maps
# a semver pre-release such as 0.0.0-dev+abc1234 to each format's rules.

name: "pakpos"
arch: ${GOARCH}
platform: "linux"
version: ${PAKPOS_PKG_VERSION}
version_schema: semver
release: "1"
section: "devel"
priority: "optional"
maintainer: "Pakpos contributors"
description: |-
  Desktop REST API client
  Build, send and save HTTP requests. Workspaces are plain YAML files you can
  commit to git; history and settings stay on your machine.
vendor: "Pakpos contributors"
# SPDX id of LICENSE (Apache License 2.0); see also NOTICE.
license: "Apache-2.0"

contents:
  - src: "./bin/pakpos"
    dst: "/usr/bin/pakpos"
    file_info:
      mode: 0755
  - src: "./LICENSE"
    dst: "/usr/share/doc/pakpos/LICENSE"
    file_info:
      mode: 0644
  - src: "./NOTICE"
    dst: "/usr/share/doc/pakpos/NOTICE"
    file_info:
      mode: 0644
  - src: "./build/linux/pakpos.desktop"
    dst: "/usr/share/applications/pakpos.desktop"
    file_info:
      mode: 0644
  - src: "./build/appicon.svg"
    dst: "/usr/share/icons/hicolor/scalable/apps/pakpos.svg"
    file_info:
      mode: 0644
  - src: "./build/appicon.png"
    dst: "/usr/share/pixmaps/pakpos.png"
    file_info:
      mode: 0644

# GTK4 + WebKitGTK 6.0 (Wails v3 default). Debian 13+ / Ubuntu 24.04+ names:
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

overrides:
  # Fedora 39+ (RHEL/Alma/Rocky 10 via EPEL where available)
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
  # Arch Linux
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

rpm:
  group: "Development/Tools"
  summary: "Desktop REST API client"

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
